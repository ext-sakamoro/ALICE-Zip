# Toolchain pin. clippy's lint set moves with the compiler, so an unpinned
# toolchain turns `-D warnings` into a gate that changes under the project
# without any change to the project.
# `targets`: the bare-metal target the CI `no_std` job builds the rlib for; listed
# here (not in the workflow) so rustup installs it for the pinned toolchain that
# cargo actually uses (dtolnay/rust-toolchain@stable would add it to stable only)
[toolchain]
channel = "1.98.1"
components = ["rustfmt", "clippy"]
targets = ["thumbv7em-none-eabihf"]
profile = "minimal"
