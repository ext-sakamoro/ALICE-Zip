# Dependabot 設定 (feedback_dependabot_major_bump_initial_wave 準拠)
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # `dtolnay/rust-toolchain@1.87` (ci.yml の msrv job) の `1.87` は action の
      # version ではなく「Rust 1.87 を入れろ」という選択子で、Cargo.toml の
      # `rust-version = "1.87"` と対で動く upstream は Rust の各版を branch
      # (refs/heads/1.87 … 1.120) として持つため dependabot はこれを version tag と
      # 誤認し「最新」へ上げようとする 上の semver-major ignore は効かない
      # (1.87 → 1.120 は dependabot の目には minor bump) ので名指しで止める
      # 実測 (PR #1, 2026-09-28): 1.120 は存在しない Rust 版で rustup が 404、
      # MSRV job のみ red MSRV を上げる時は Cargo.toml と ci.yml を手で対に変える
      - dependency-name: "dtolnay/rust-toolchain"

