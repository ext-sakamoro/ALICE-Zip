# Builds and checks the wheel `libalice` (libalice/pyproject.toml, built by
# maturin from libalice/Cargo.toml). Nothing is published: the package is
# LicenseRef-Proprietary, and versions already on PyPI stay as they are.
#
# Trigger: a tag `py-libalice-v<version>` whose <version> equals `version` in
# libalice/Cargo.toml (scripts/pypi_tag_check.py; the wheel takes its version
# from there). The tags `v<version>` and `alice-zip-cli-v<version>` are the
# Rust crates on crates.io and publish nothing here; the Python package
# `alice-zip` has its own workflow (pypi.yml, tag `py-alice-zip-v<version>`).
#
# libalice is not abi3, so a wheel is built for every interpreter maturin
# finds on each platform. The workflow never commits and holds no `id-token`.
name: PyPI (libalice)

on:
  push:
    tags: ['py-libalice-v*']

permissions:
  contents: read

concurrency:
  group: pypi-libalice-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: The tag names libalice and its version is Cargo.toml's
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Check
        run: |
          python3 scripts/test_pypi_tag_check.py
          out=$(python3 scripts/pypi_tag_check.py "$GITHUB_REF_NAME")
          printf '%s\n' "$out"
          [ "$(printf '%s\n' "$out" | tail -n 1)" = libalice ] \
            || { echo "::error::$GITHUB_REF_NAME does not name libalice"; exit 1; }
          python3 scripts/version_check.py

  wheels:
    name: Wheels (${{ matrix.os }} ${{ matrix.target }})
    needs: tag
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { os: ubuntu-latest, target: aarch64, manylinux: auto }
          # one universal2 wheel per interpreter covers Intel and Apple silicon
          - { os: macos-14, target: universal2-apple-darwin, manylinux: '' }
          - { os: windows-latest, target: x64, manylinux: '' }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: |
            3.9
            3.10
            3.11
            3.12
            3.13
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: libalice
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist --find-interpreter
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: libalice-wheels-${{ matrix.os }}-${{ matrix.target }}
          path: libalice/dist/*.whl
          if-no-files-found: error

  sdist:
    name: sdist
    needs: tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: libalice
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: libalice-sdist
          path: libalice/dist/*.tar.gz
          if-no-files-found: error

  check:
    name: Every archive carries the tag's version and LicenseRef-Proprietary
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: libalice-*
          path: dist/
          merge-multiple: true
      - name: Check
        run: |
          version="${GITHUB_REF_NAME#py-libalice-v}"
          n_whl=$(find dist -maxdepth 1 -name 'libalice-*.whl' | wc -l)
          n_sdist=$(find dist -maxdepth 1 -name 'libalice-*.tar.gz' | wc -l)
          [ "$n_whl" -ge 1 ] && [ "$n_sdist" -eq 1 ] \
            || { echo "::error::expected wheels and 1 sdist, got $n_whl / $n_sdist"; ls -l dist; exit 1; }
          # at least one wheel for every platform of the matrix
          for plat in 'manylinux*_x86_64' 'manylinux*_aarch64' 'macosx_*_universal2' 'win_amd64'; do
            n=$(find dist -maxdepth 1 -name "libalice-*-${plat}.whl" | wc -l)
            [ "$n" -ge 1 ] || { echo "::error::no wheel for $plat"; ls -l dist; exit 1; }
            echo "$plat: $n wheel(s)"
          done
          off=$(find dist -maxdepth 1 \( -name 'libalice-*.whl' -o -name 'libalice-*.tar.gz' \) ! -name "libalice-${version}-*.whl" ! -name "libalice-${version}.tar.gz" | wc -l)
          [ "$off" -eq 0 ] \
            || { echo "::error::$off archive(s) do not carry version $version"; ls -l dist; exit 1; }
          python -m pip install --upgrade pip twine
          python3 scripts/dist_license_check.py 'dist/*.whl' 'dist/*.tar.gz'
          twine check --strict dist/*
          ls -l dist
