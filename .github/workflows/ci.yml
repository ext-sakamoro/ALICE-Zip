name: CI

# Every step here is mirrored in scripts/preflight.sh (run before `git push`):
# a step that is not in preflight.sh is a step that can only fail remotely.

on:
  push:
    # ci/** runs the whole workflow on a branch before it is landed on main
    branches: [main, "ci/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # docs.rs feature set (Cargo.toml [package.metadata.docs.rs])
  ALL_FEATURES: std,fft,parallel,lzma

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    # bash on every OS: under PowerShell (the Windows default) "$ALL_FEATURES"
    # is an undefined PowerShell variable, not the environment variable, so the
    # feature set was empty there and the lzma-gated suites ran 0 tests
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # scripts/run_tests.sh fails the step when no test ran or when a named
      # golden file ran none (a feature or target mismatch would otherwise pass
      # as an empty run); the full suite still runs
      - name: Test (default features)
        run: scripts/run_tests.sh determinism_golden,float_edge_golden,analytic_law_id,minmax_sign_golden,float_environment=2,int2d_oracle=23,zip_semantics_id,container_format_id,residual_semantics_id,container_stream=9,container_count_bound=1 -- cargo test
      - name: Test (docs.rs feature set)
        run: scripts/run_tests.sh determinism_golden,float_edge_golden,analytic_law_id,minmax_sign_golden,float_environment=2,int2d_oracle=23,order_determinism,zip_semantics_id,container_format_id,residual_semantics_id,container_stream=9,container_count_bound=1 -- cargo test --features "$ALL_FEATURES"
      - name: Test (no_std, lib unit tests)
        run: cargo test --lib --no-default-features
      # The golden records bit patterns, so it is the one suite whose result
      # depends on the OS and on which float implementation is linked. The two
      # runs above cover the default build on each OS; this adds the no_std
      # build, where `sqrt` / `floor` / `round` come from `libm` instead of the
      # platform. Every one of these runs has to produce the same digests.
      - name: Determinism golden (no_std build, same digests as the std build)
        run: scripts/run_tests.sh determinism_golden -- cargo test --test determinism_golden --no-default-features
      # The container's bytes and identifiers are compared with fixtures
      # written by an independent reference (tests/data/container/), on each
      # OS and in the no_std build.
      - name: Container (no_std build, same bytes and identifiers)
        run: scripts/run_tests.sh container_oracle -- cargo test --test container_oracle --no-default-features
      - name: Container read by a format that declares its own required tags (no_std build)
        run: scripts/run_tests.sh container_known_tags -- cargo test --test container_known_tags --no-default-features
      - name: Container example (reads back, resolves references, refuses a changed byte)
        run: cargo run --example container_roundtrip
      # alice-zip 0.10.0 from crates.io (in its own package and lock file)
      # against this version: 0.10 refuses every container and residual
      # container this version writes instead of reading it as its own format,
      # and what 0.10 wrote reads here as legacy, to the same samples
      - name: Released 0.10 formats against the current ones (refused one way, legacy the other)
        run: scripts/run_tests.sh refuses_the_current_format=2,residual_containers_across_versions=2 -- cargo test --manifest-path compat/v0_10_reader/Cargo.toml --locked
      # each published version in one place (libalice from its Cargo.toml) or
      # agreeing where it is written twice; 0 comparisons fail
      - name: Versions agree
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" scripts/test_version_check.py
          "$PY" scripts/version_check.py
          "$PY" scripts/test_pypi_tag_check.py
      # every tracked Cargo.lock (root, libalice, fuzz, libalice-enterprise) is the
      # one cargo would write: a stale sub-workspace lock is repaired silently by
      # every build, so only `cargo metadata --locked` sees it; 0 lock files fail
      - name: Tracked lock files match their manifests
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" scripts/test_lock_check.py
          "$PY" scripts/lock_check.py
      # Apache-2.0 everywhere it is stated, NOTICE + LICENSE-APACHE shipped in
      # both crates (libalice carries identical copies); 0 comparisons fail
      - name: Licence agrees and its files are packaged
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" scripts/test_license_check.py
          "$PY" scripts/license_check.py
          "$PY" scripts/test_dist_license_check.py
          for m in Cargo.toml libalice/Cargo.toml; do
            list=$(cargo package --list --allow-dirty --manifest-path "$m")
            for f in LICENSE-APACHE NOTICE; do
              printf '%s\n' "$list" | grep -qx "$f" || { echo "::error::$m: the package lacks $f"; exit 1; }
            done
            echo "$m: LICENSE-APACHE and NOTICE packaged"
          done
      # A suite gated on a feature compiles to an empty test binary when the
      # feature is missing, which passes with 0 tests. Each of these must
      # report at least one passed test on every OS.
      # the zero-test guard shared with ALICE-DB / ALICE-Analytics, on each
      # OS's own bash
      - name: run_tests.sh (tests)
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" scripts/test_run_tests.py
      # the path filter of g3-ir.yml (shared with the other ALICE crates): its own tests
      - name: changed_paths.py (tests)
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" scripts/test_changed_paths.py
      # ALICE-Law G11 (c): the files shared with the other crates are the bytes ALICE-Law's
      # table records (table and checker fetched at .github/shared-files-pin, both SHA-256
      # pinned); a difference, an unlisted shared path or nothing compared fails
      - name: Shared files equal ALICE-Law's table
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" scripts/test_shared_files.py
          scripts/shared_files.sh
      # G14, static half: no fast-math-style flag, target-cpu=native or flag value
      # the guard cannot resolve in any file a flag can come from (deliberate
      # occurrences in scripts/build_config_allowlist.toml); nothing read fails.
      # The dynamic half's parser is tested here too (the check itself runs in
      # release-profile.yml)
      - name: Build configuration guard (test, then check)
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" scripts/test_build_config_guard.py
          "$PY" scripts/build_config_guard.py
          "$PY" scripts/test_build_flags_check.py
      # ALICE-Law G3, syntax-tree pre-check (tools/no-outer-fneg-of-fma, byte-identical to
      # ALICE-LOL's, built with --locked): its own tests, then the check over src/ tests/
      # examples/ benches/ with the exact fma-call counts of
      # scripts/no-outer-fneg-of-fma-allowlist.toml; the IR half is g3-ir.yml
      - name: No negated fma result (syntax tree, tests then check)
        run: |
          cargo fmt --manifest-path tools/no-outer-fneg-of-fma/Cargo.toml -- --check
          cargo test --quiet --locked --manifest-path tools/no-outer-fneg-of-fma/Cargo.toml
          cargo run --quiet --locked --release --manifest-path tools/no-outer-fneg-of-fma/Cargo.toml -- --root .
      - name: Feature-gated suites run on this OS
        run: |
          set -o pipefail
          for t in residual_container_oracle container_oracle container_known_tags; do
            cargo test --features "$ALL_FEATURES" --test "$t" 2>&1 | tee "gated-$t.log"
            sed 's/\x1b\[[0-9;]*m//g; s/\x1b(B//g' "gated-$t.log" | grep -E 'test result: ok\. [1-9][0-9]* passed'
          done

  wasm:
    name: wasm32-wasip1 (container, same bytes and identifiers)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # the target comes from rust-toolchain.toml (the pinned toolchain cargo
      # uses); `targets:` here would add it to stable only
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasmtime
      # A run that executes no test must not pass: the summary line is read
      # (escape sequences removed) and must report at least one passed test.
      - name: Container oracles under wasmtime
        shell: bash
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime
        run: |
          set -o pipefail
          for t in container_oracle container_known_tags; do
            cargo test --target wasm32-wasip1 --test "$t" 2>&1 | tee "wasm-$t.log"
            sed 's/\x1b\[[0-9;]*m//g; s/\x1b(B//g' "wasm-$t.log" | grep -E 'test result: ok\. [1-9][0-9]* passed'
          done

  example:
    name: compression_ratio example (runs; the xor rows are bit-exact)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # the README's ratios come from this example; it must run to the end and
      # its law + xor residual table must report every row bit-exact
      - name: Run the example the README numbers come from
        shell: bash
        run: |
          set -o pipefail
          cargo run --release --example compression_ratio --features lzma | tee example.txt
          python3 scripts/example_check.py example.txt

  clippy:
    name: Clippy (-D warnings)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # the release tags: scripts/id_move_check.py compares with the newest one
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: clippy (default, all targets)
        run: cargo clippy --all-targets -- -D warnings
      - name: clippy (docs.rs feature set, all targets)
        run: cargo clippy --all-targets --features "$ALL_FEATURES" -- -D warnings
      # the no_std build of every target: lints that only appear there (an item
      # used only under std) and targets that need std declare it
      - name: clippy (no default features, all targets)
        run: cargo clippy --all-targets --no-default-features -- -D warnings
      # the lists in clippy.toml only gate anything if clippy flags a call to
      # them: a throwaway crate with the same clippy.toml plants one banned call
      # per row of scripts/clippy_canary_calls.tsv (0 rows fail). The rows are
      # generated from clippy.toml, one per disallowed-methods / disallowed-types
      # entry; --check fails when the file has drifted from clippy.toml
      - name: Clippy canary data (generator tests)
        run: python3 scripts/test_gen_clippy_canary_calls.py
      - name: Clippy canary data (generated from clippy.toml, no drift)
        run: python3 scripts/gen_clippy_canary_calls.py --check
      - name: Clippy canary (tests)
        run: python3 scripts/test_clippy_canary.py
      # the preflight mirror of law-readme-block.yml (the check itself runs there, here its tests)
      - name: README ALICE-Law block preflight check (tests)
        run: python3 scripts/test_law_readme_block_check.py
      - name: Clippy canary (every planted banned call is flagged)
        run: python3 scripts/clippy_canary.py
      # the direct libm dependency: its free functions are out of reach of the
      # f32 / f64 method entries, so clippy.toml bans them by path; this fails
      # when that list and the libm in Cargo.lock disagree, and plants banned
      # libm calls in a throwaway crate to confirm clippy flags them
      - name: libm ban list (tests)
        run: python3 scripts/test_libm_ban_check.py
      - name: libm ban list (complete for the resolved libm, and enforced)
        run: python3 scripts/libm_ban_check.py
      # 決定論: production の code は OS の entropy も時計も使わない (clippy.toml
      # disallowed-methods が第一層、これは compile 不要の第二層) この job は
      # push: branches [main, "ci/**"] に paths filter 無しで乗るため、
      # security-audit.yml (main のみ・paths filter 付き) から移設した
      - name: Entropy guard (test first)
        run: python3 scripts/test_entropy_guard.py
      - name: Entropy guard (no OS entropy or wall clock in production code)
        run: python3 scripts/entropy_guard.py
      # G13: no unspecified-order collection, thread combination or address order in production code
      - name: Order guard (tests)
        run: python3 scripts/test_order_guard.py
      - name: Order guard
        run: python3 scripts/order_guard.py
      # G9: an identifier (SEMANTICS_ID) moves only with a breaking version, with the
      # released value in PREVIOUS_SEMANTICS_IDS and both named in CHANGELOG.md; the
      # released value is read from the published crate at the newest release tag. A
      # registry that cannot be read fails on main and warns on ci/ branches and PRs
      - name: Identifier moves (tests)
        run: python3 scripts/test_id_move_check.py
      - name: Identifier moves (the release compared with)
        id: id-base
        run: echo "crate=$(python3 scripts/id_move_check.py --print-base)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ~/.cargo/registry/cache/*/${{ steps.id-base.outputs.crate }}.crate
          key: id-move-${{ steps.id-base.outputs.crate }}
      - name: Identifier moves (against the published release)
        run: python3 scripts/id_move_check.py

  no_std:
    name: no_std (rlib, thumbv7em-none-eabihf)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # rust-toolchain.toml carries the pin and the bare-metal target
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `cargo check` on host is not a no_std proof (std is linked anyway);
      # only a target without std is. rlib crate-type: no panic handler needed.
      - name: Build rlib for a target without std
        run: cargo rustc --lib --no-default-features --crate-type rlib --target thumbv7em-none-eabihf
      - name: Clippy on the no_std build (-D warnings)
        run: >
          RUSTC_WORKSPACE_WRAPPER="$(rustup which clippy-driver)"
          cargo rustc --lib --no-default-features --crate-type rlib
          --target thumbv7em-none-eabihf -- -D warnings
      # A host build without std still has std linked as soon as another crate
      # in the graph enables it. A downstream that turns on `alice-det-math`'s
      # default (`std`) does exactly that, and its `-D warnings` build compiles
      # this crate with that graph. Both graphs are built here: method syntax
      # on floats would pick a different implementation in each.
      - name: Host lib build without std (-D warnings)
        run: RUSTFLAGS="-D warnings" cargo build --lib --no-default-features
      - name: Host lib build without std, alice-det-math std on (-D warnings)
        run: RUSTFLAGS="-D warnings" cargo build --lib --no-default-features --features alice-det-math/std

  msrv:
    name: MSRV (rust-version = 1.87)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@1.87
      - uses: Swatinem/rust-cache@v2
      # `rust-version` is only true if this compiles; bump both together
      - name: cargo check on MSRV (lib, default features)
        run: cargo +1.87 check --lib --locked
      - name: cargo check on MSRV (lib, docs.rs feature set)
        run: cargo +1.87 check --lib --locked --features "$ALL_FEATURES"
      - name: cargo check on MSRV (lib, no_std)
        run: cargo +1.87 check --lib --locked --no-default-features
      - name: cargo check on MSRV (libalice, default features)
        run: cargo +1.87 check --manifest-path libalice/Cargo.toml --locked

  feature-powerset:
    name: Feature powerset (cargo-hack)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack
      # 3 features → 8 combinations; `fft` / `parallel` imply `std`
      - name: Powerset (all depths)
        run: cargo hack check --lib --feature-powerset

  doc:
    name: Doc (RUSTDOCFLAGS=-Dwarnings)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc (default)
        run: RUSTDOCFLAGS="-Dwarnings" cargo doc --lib --no-deps
      - name: cargo doc (docs.rs feature set)
        run: RUSTDOCFLAGS="-Dwarnings" cargo doc --lib --no-deps --features "$ALL_FEATURES"

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting (core)
        run: cargo fmt -- --check
      - name: Check formatting (libalice)
        run: cargo fmt --manifest-path libalice/Cargo.toml -- --check
      - name: Check formatting (released-reader check)
        run: cargo fmt --manifest-path compat/v0_10_reader/Cargo.toml -- --check

  claim-check:
    name: README の主張と test の対応
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      # README の `<!-- claim-test: NAME -->` は「この主張には試験がある」と
      # 読まれるが、2026-10-09 まで検査が無く、rename や削除で marker だけが
      # 残る経路が開いていた 併せてベンチマーク表には marker が 1 つも無く、
      # 圧縮率を 2 桁以上過大に書いた状態で全 gate が green だった
      # ⚠️ marker 0 件でも fail する (空振りを成功と読ませない)
      - name: claim-test marker が実在の試験を指しているか
        run: python3 scripts/claim_check.py
      # README.md と README_ja.md の見出しの対応 (scripts/readme_headings.toml)・節ごとの段落 /
      # 箇条書き / 表の行 / code block の数・code block の中身・数値・hash・crate 名・link を照合する
      # 検査器自身の試験を先に走らせる ⚠️ 比較 0 件でも fail する
      - name: README の英語版と日本語版の対応
        run: |
          python3 scripts/test_readme_parity_check.py
          python3 scripts/readme_parity_check.py
      # 改名で古い名前の呼び出しが残ると、pytest が実行しない場所 (__main__
      # の block など) では誰も気付かない ⚠️ 検査した file が 0 件でも fail
      - name: Python の未定義の名前と上書き (ruff F821 / F811)
        run: |
          python3 -m pip install ruff==0.14.0
          python3 scripts/undefined_names.py
      # include_bytes! / include_str! の参照先が追跡されているか (ignore に当たった
      # fixture は手元では compile できても clean な checkout では compile できない)
      # ⚠️ 比較 0 件でも fail する
      - name: include の参照先が git で追跡されているか
        run: |
          python3 scripts/test_include_tracked.py
          python3 scripts/include_tracked.py
      # build した library (.so / .dylib / .a / .dll / .wasm 等) を commit すると、
      # clean な checkout で再現しない成果物が混ざる 名前・内容の両面で検出し、
      # 正当なものは .github/tracked-binaries.txt に理由付きで列挙する
      # ⚠️ 走査した file が 0 件でも fail する (空振りを成功と読ませない)
      - name: build した library を commit していないか
        run: |
          python3 scripts/test_tracked_binaries.py
          python3 scripts/tracked_binaries.py

  libalice:
    name: libalice (CLI / FFI crate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: libalice
      # `python` (PyO3 build against the runner's interpreter) is out of scope
      # for this gate; `codec` is a crates.io dep (alice-codec) and is tested
      - name: Test (default)
        run: cargo test --manifest-path libalice/Cargo.toml
      - name: Test (codec bridge)
        run: cargo test --manifest-path libalice/Cargo.toml --features codec
      - name: Clippy (-D warnings, all targets, codec)
        run: cargo clippy --manifest-path libalice/Cargo.toml --all-targets --features codec -- -D warnings
      - name: Doc (-D warnings)
        run: RUSTDOCFLAGS="-Dwarnings" cargo doc --manifest-path libalice/Cargo.toml --lib --no-deps
      # cdylib + bin release build = what the C# / UE5 / Python bindings load
      - name: Release build (cdylib + CLI)
        run: cargo build --manifest-path libalice/Cargo.toml --release

  libalice-python:
    name: libalice Python module (PyO3) + pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # the oldest Python the packages declare (requires-python) and a current
    # one, so the declared minimum is the one that is tested
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: libalice
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      # extension-module: the .so links against the interpreter at import time,
      # so `cargo test` cannot link — check / clippy the feature, then build the
      # real wheel with maturin and run the Python test suite with the native
      # accelerator enabled (the same suite runs pure-Python when it is absent)
      - name: cargo check / clippy (python feature)
        run: |
          cargo check --manifest-path libalice/Cargo.toml --features python
          cargo clippy --manifest-path libalice/Cargo.toml --features python --all-targets -- -D warnings
      # `maturin develop` needs a virtualenv; build the wheel and pip-install it
      - name: Build + install libalice (maturin)
        run: |
          python -m pip install --upgrade pip
          # scipy: the audio generator writes wav through scipy.io (its tests skip without it)
          pip install maturin numpy pytest scipy
          (cd libalice && maturin build --release --out ../target/wheels)
          pip install target/wheels/libalice-*.whl
      # LICENSE-APACHE and NOTICE inside every built archive, and the
      # Apache-2.0 expression in its metadata (libalice and alice-zip)
      - name: Licence files in the wheels and sdists
        run: |
          pip install build
          (cd libalice && maturin sdist --out ../target/wheels)
          python -m build --outdir target/pydist .
          python scripts/dist_license_check.py 'target/wheels/libalice-*.whl' 'target/wheels/libalice-*.tar.gz' 'target/pydist/*.whl' 'target/pydist/*.tar.gz'
      - name: pytest (native accelerator enabled)
        run: |
          pip install -e .
          python -c "import libalice, alice_zip.native_accelerator as n; assert n.is_available(), 'native accelerator not loaded'"
          python -m pytest tests/ -q -p no:cacheprovider
      - name: pytest (pure Python fallback)
        run: |
          pip uninstall -y libalice
          python -c "import alice_zip.native_accelerator as n; assert not n.is_available()"
          python -m pytest tests/ -q -p no:cacheprovider

  actionlint:
    name: actionlint (workflow YAML 検証)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          reporter: github-check
      # every job has a job-level timeout-minutes (a hung step otherwise holds a shared
      # runner for GitHub's 6-hour limit); the checker's own tests run first
      - name: workflow-timeouts
        run: |
          python3 scripts/test_workflow_timeouts.py
          python3 scripts/workflow_timeouts.py
      # a run on main is never cancelled and each main commit has its own group
      - name: workflow-concurrency
        run: |
          python3 scripts/test_workflow_concurrency.py
          python3 scripts/workflow_concurrency.py
