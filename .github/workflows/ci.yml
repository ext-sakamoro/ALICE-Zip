name: CI

# Every step here is mirrored in scripts/preflight.sh (run before `git push`):
# a step that is not in preflight.sh is a step that can only fail remotely.

on:
  push:
    # ci/** runs the whole workflow on a branch before it is landed on main
    branches: [main, "ci/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # docs.rs feature set (Cargo.toml [package.metadata.docs.rs])
  ALL_FEATURES: std,fft,parallel,lzma

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # bash on every OS: under PowerShell (the Windows default) "$ALL_FEATURES"
    # is an undefined PowerShell variable, not the environment variable, so the
    # feature set was empty there and the lzma-gated suites ran 0 tests
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test (default features)
        run: cargo test
      - name: Test (docs.rs feature set)
        run: cargo test --features "$ALL_FEATURES"
      - name: Test (no_std, lib unit tests)
        run: cargo test --lib --no-default-features
      # The golden records bit patterns, so it is the one suite whose result
      # depends on the OS and on which float implementation is linked. The two
      # runs above cover the default build on each OS; this adds the no_std
      # build, where `sqrt` / `floor` / `round` come from `libm` instead of the
      # platform. Every one of these runs has to produce the same digests.
      - name: Determinism golden (no_std build, same digests as the std build)
        run: cargo test --test determinism_golden --no-default-features
      # The container's bytes and identifiers are compared with fixtures
      # written by an independent reference (tests/data/container/), on each
      # OS and in the no_std build.
      - name: Container (no_std build, same bytes and identifiers)
        run: cargo test --test container_oracle --no-default-features
      - name: Container example (reads back, resolves references, refuses a changed byte)
        run: cargo run --example container_roundtrip
      # each published version in one place (libalice from its Cargo.toml) or
      # agreeing where it is written twice; 0 comparisons fail
      - name: Versions agree
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" scripts/test_version_check.py
          "$PY" scripts/version_check.py
      # A suite gated on a feature compiles to an empty test binary when the
      # feature is missing, which passes with 0 tests. Each of these must
      # report at least one passed test on every OS.
      - name: Feature-gated suites run on this OS
        run: |
          set -o pipefail
          for t in residual_container_oracle container_oracle; do
            cargo test --features "$ALL_FEATURES" --test "$t" 2>&1 | tee "gated-$t.log"
            sed 's/\x1b\[[0-9;]*m//g; s/\x1b(B//g' "gated-$t.log" | grep -E 'test result: ok\. [1-9][0-9]* passed'
          done

  wasm:
    name: wasm32-wasip1 (container, same bytes and identifiers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # the target comes from rust-toolchain.toml (the pinned toolchain cargo
      # uses); `targets:` here would add it to stable only
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasmtime
      # A run that executes no test must not pass: the summary line is read
      # (escape sequences removed) and must report at least one passed test.
      - name: Container oracles under wasmtime
        shell: bash
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime
        run: |
          set -o pipefail
          cargo test --target wasm32-wasip1 --test container_oracle 2>&1 | tee wasm-test.log
          sed 's/\x1b\[[0-9;]*m//g; s/\x1b(B//g' wasm-test.log | grep -E 'test result: ok\. [1-9][0-9]* passed'

  example:
    name: compression_ratio example (runs; the xor rows are bit-exact)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # the README's ratios come from this example; it must run to the end and
      # its law + xor residual table must report every row bit-exact
      - name: Run the example the README numbers come from
        shell: bash
        run: |
          set -o pipefail
          cargo run --release --example compression_ratio --features lzma | tee example.txt
          python3 scripts/example_check.py example.txt

  clippy:
    name: Clippy (-D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: clippy (default, all targets)
        run: cargo clippy --all-targets -- -D warnings
      - name: clippy (docs.rs feature set, all targets)
        run: cargo clippy --all-targets --features "$ALL_FEATURES" -- -D warnings
      # the no_std build of every target: lints that only appear there (an item
      # used only under std) and targets that need std declare it
      - name: clippy (no default features, all targets)
        run: cargo clippy --all-targets --no-default-features -- -D warnings

  no_std:
    name: no_std (rlib, thumbv7em-none-eabihf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # rust-toolchain.toml carries the pin and the bare-metal target
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `cargo check` on host is not a no_std proof (std is linked anyway);
      # only a target without std is. rlib crate-type: no panic handler needed.
      - name: Build rlib for a target without std
        run: cargo rustc --lib --no-default-features --crate-type rlib --target thumbv7em-none-eabihf
      - name: Clippy on the no_std build (-D warnings)
        run: >
          RUSTC_WORKSPACE_WRAPPER="$(rustup which clippy-driver)"
          cargo rustc --lib --no-default-features --crate-type rlib
          --target thumbv7em-none-eabihf -- -D warnings
      # A host build without std still has std linked as soon as another crate
      # in the graph enables it. A downstream that turns on `alice-det-math`'s
      # default (`std`) does exactly that, and its `-D warnings` build compiles
      # this crate with that graph. Both graphs are built here: method syntax
      # on floats would pick a different implementation in each.
      - name: Host lib build without std (-D warnings)
        run: RUSTFLAGS="-D warnings" cargo build --lib --no-default-features
      - name: Host lib build without std, alice-det-math std on (-D warnings)
        run: RUSTFLAGS="-D warnings" cargo build --lib --no-default-features --features alice-det-math/std

  msrv:
    name: MSRV (rust-version = 1.87)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@1.87
      - uses: Swatinem/rust-cache@v2
      # `rust-version` is only true if this compiles; bump both together
      # (canonical template trap #27 / #35)
      - name: cargo check on MSRV (lib, default features)
        run: cargo +1.87 check --lib --locked
      - name: cargo check on MSRV (lib, docs.rs feature set)
        run: cargo +1.87 check --lib --locked --features "$ALL_FEATURES"
      - name: cargo check on MSRV (lib, no_std)
        run: cargo +1.87 check --lib --locked --no-default-features
      - name: cargo check on MSRV (libalice, default features)
        run: cargo +1.87 check --manifest-path libalice/Cargo.toml --locked

  feature-powerset:
    name: Feature powerset (cargo-hack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack
      # 3 features → 8 combinations; `fft` / `parallel` imply `std`
      - name: Powerset (all depths)
        run: cargo hack check --lib --feature-powerset

  doc:
    name: Doc (RUSTDOCFLAGS=-Dwarnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc (default)
        run: RUSTDOCFLAGS="-Dwarnings" cargo doc --lib --no-deps
      - name: cargo doc (docs.rs feature set)
        run: RUSTDOCFLAGS="-Dwarnings" cargo doc --lib --no-deps --features "$ALL_FEATURES"

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting (core)
        run: cargo fmt -- --check
      - name: Check formatting (libalice)
        run: cargo fmt --manifest-path libalice/Cargo.toml -- --check

  claim-check:
    name: README の主張と test の対応
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # README の `<!-- claim-test: NAME -->` は「この主張には試験がある」と
      # 読まれるが、2026-10-09 まで検査が無く、rename や削除で marker だけが
      # 残る経路が開いていた 併せてベンチマーク表には marker が 1 つも無く、
      # 圧縮率を 2 桁以上過大に書いた状態で全 gate が green だった
      # ⚠️ marker 0 件でも fail する (空振りを成功と読ませない)
      - name: claim-test marker が実在の試験を指しているか
        run: python3 scripts/claim_check.py
      # 改名で古い名前の呼び出しが残ると、pytest が実行しない場所 (__main__
      # の block など) では誰も気付かない ⚠️ 検査した file が 0 件でも fail
      - name: Python の未定義の名前と上書き (ruff F821 / F811)
        run: |
          python3 -m pip install ruff==0.14.0
          python3 scripts/undefined_names.py
      # include_bytes! / include_str! の参照先が追跡されているか (ignore に当たった
      # fixture は手元では compile できても clean な checkout では compile できない)
      # ⚠️ 比較 0 件でも fail する
      - name: include の参照先が git で追跡されているか
        run: |
          python3 scripts/test_include_tracked.py
          python3 scripts/include_tracked.py

  libalice:
    name: libalice (CLI / FFI crate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: libalice
      # `python` (PyO3 build against the runner's interpreter) is out of scope
      # for this gate; `codec` is a crates.io dep (alice-codec) and is tested
      - name: Test (default)
        run: cargo test --manifest-path libalice/Cargo.toml
      - name: Test (codec bridge)
        run: cargo test --manifest-path libalice/Cargo.toml --features codec
      - name: Clippy (-D warnings, all targets, codec)
        run: cargo clippy --manifest-path libalice/Cargo.toml --all-targets --features codec -- -D warnings
      - name: Doc (-D warnings)
        run: RUSTDOCFLAGS="-Dwarnings" cargo doc --manifest-path libalice/Cargo.toml --lib --no-deps
      # cdylib + bin release build = what the C# / UE5 / Python bindings load
      - name: Release build (cdylib + CLI)
        run: cargo build --manifest-path libalice/Cargo.toml --release

  libalice-python:
    name: libalice Python module (PyO3) + pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    # the oldest Python the packages declare (requires-python) and a current
    # one, so the declared minimum is the one that is tested
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: libalice
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      # extension-module: the .so links against the interpreter at import time,
      # so `cargo test` cannot link — check / clippy the feature, then build the
      # real wheel with maturin and run the Python test suite with the native
      # accelerator enabled (the same suite runs pure-Python when it is absent)
      - name: cargo check / clippy (python feature)
        run: |
          cargo check --manifest-path libalice/Cargo.toml --features python
          cargo clippy --manifest-path libalice/Cargo.toml --features python --all-targets -- -D warnings
      # `maturin develop` needs a virtualenv; build the wheel and pip-install it
      - name: Build + install libalice (maturin)
        run: |
          python -m pip install --upgrade pip
          pip install maturin numpy pytest
          (cd libalice && maturin build --release --out ../target/wheels)
          pip install target/wheels/libalice-*.whl
      - name: pytest (native accelerator enabled)
        run: |
          pip install -e .
          python -c "import libalice, alice_zip.native_accelerator as n; assert n.is_available(), 'native accelerator not loaded'"
          python -m pytest tests/ -q -p no:cacheprovider
      - name: pytest (pure Python fallback)
        run: |
          pip uninstall -y libalice
          python -c "import alice_zip.native_accelerator as n; assert not n.is_available()"
          python -m pytest tests/ -q -p no:cacheprovider

  actionlint:
    name: actionlint (workflow YAML 検証)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          reporter: github-check
