# scripts/id_move_check.py (ALICE-Law G9): the identifiers whose value may move only with a
# breaking version, the previous-identifier list that must keep the released value, and the
# release tags the base is read from (its values come from the published crate)
package = "alice-zip"
manifest = "Cargo.toml"
tags = ["v{version}"]

[exempt]
DET_MATH_SEMANTICS_ID = "alice-det-math's own identifier, re-exported for reference: this crate stamps law::SEMANTICS_ID, which folds it (src/semantics.rs), so a move of it moves SEMANTICS_ID and is checked there; its own history is alice-det-math's G9"
[[id]]
path = "alice_zip::law::SEMANTICS_ID"
previous = "alice_zip::semantics::PREVIOUS_SEMANTICS_IDS"
# the tests that reproduce a previous identifier's bits: each must pass, and fail once the old
# value is taken out of the list (scripts/id_move_check.py runs both)
previous-tests = [
    "tests/determinism_golden.rs::law_id_digest_under_the_previous_zip_identifier_is_unchanged",
    "tests/zip_semantics_id.rs::check_semantics_reads_this_and_previous_identifiers",
]

[[id]]
# the payload of the FMID section of a container (no previous list: another value is refused)
path = "alice_zip::container::FORMAT_ID"

[[id]]
# the bytes the deflate encoders give for the probe inputs (no previous list: a moved value
# means compressed sizes counted by callers move, and check_codec_bytes refuses the other)
path = "alice_zip::compression::DEFLATE_BYTES_ID"

[[id]]
# the same for the lzma encoder (lzma feature)
path = "alice_zip::compression::LZMA_BYTES_ID"
