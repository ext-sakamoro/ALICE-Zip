# cargo-deny 設定 (v0.14+ schema)
# https://embarkstudios.github.io/cargo-deny/
#
# 目的: license 逸脱 (GPL 侵入等) と CVE / yanked / duplicate crate の CI gate
# 実行: cargo deny --all-features check all (core)、
#       cargo deny --manifest-path libalice/Cargo.toml --config deny.toml check all (libalice)

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

# ---------------------------------------------------------------------------
# Advisories (RustSec CVE + yanked)
# ---------------------------------------------------------------------------
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
version = 2
yanked = "deny"
ignore = [
    # unmaintained warnings (informational only、CVE ではない) — none at present
]

# ---------------------------------------------------------------------------
# Licenses (allow-list 方式、記載外 = deny)
# alice-zip は MIT OR Apache-2.0 デュアルライセンス、libalice は MIT
# ---------------------------------------------------------------------------
[licenses]
version = 2
confidence-threshold = 0.8
# libalice-enterprise is `license = "Proprietary"` (not SPDX) and never published:
# skip the license check for unpublished workspace members
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",       # unicode-ident 1.13+
    "Unicode-DFS-2016",  # unicode-ident 旧 version
    "CC0-1.0",           # public domain 相当
    "0BSD",
    "BSL-1.0",           # Boost Software License
    "MPL-2.0",           # weak copyleft (file-level)、静的リンク OK
    "OpenSSL",           # ring 等
]

# alice-codec (ALICE sibling crate, libalice `codec` feature, default OFF, path
# dep ../../ALICE-Codec) is AGPL-3.0; the exception is limited to that crate
[[licenses.exceptions]]
name = "alice-codec"
allow = ["AGPL-3.0", "AGPL-3.0-only", "AGPL-3.0-or-later"]

# ---------------------------------------------------------------------------
# Bans (banned crate / duplicate / wildcard)
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
# path dep (libalice → ../) は wildcard version になるので allow
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
deny = []
skip = []
skip-tree = []

# ---------------------------------------------------------------------------
# Sources (crate registry / git source 制限)
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
