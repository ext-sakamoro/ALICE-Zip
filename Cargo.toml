[package]
name = "alice-zip"
version = "0.9.0"
edition = "2021"
# MSRV-aware dependency resolution (cargo 1.84+): `cargo update` never picks a
# dependency whose own `rust-version` exceeds ours, so the lockfile cannot
# silently drift away from the declared MSRV (canonical template trap #35).
resolver = "3"
authors = ["Moroya Sakamoto <sakamoro@alicelaw.net>"]
description = "Compression primitives (LZ77, dictionary coding, BPE, entropy, quantisation) + procedural signal generators (polynomial / Fourier / Perlin) + zlib / LZMA residual containers, no_std + alloc"
license = "Apache-2.0"
repository = "https://github.com/ext-sakamoro/ALICE-Zip"
homepage = "https://github.com/ext-sakamoro/ALICE-Zip"
documentation = "https://docs.rs/alice-zip"
# `Dictionary::len` / `is_empty` are `const fn` over `Vec` (stabilised in 1.87).
# Verified by the `msrv` CI job (`cargo +1.87 check`); bump both together.
rust-version = "1.87"
keywords = ["compression", "lz77", "fourier", "polynomial", "no-std"]
categories = ["compression", "algorithms", "no-std", "science"]
exclude = [
    "/alice",
    "/alice_zip",
    "/assets",
    "/benchmarks",
    "/bindings",
    "/fuzz",
    "/libalice",
    "/libalice-enterprise",
    "/scripts",
    "/tests/*.py",
    "/.github",
    "*.png",
    "pyproject.toml",
]

[features]
default = ["std"]
# Host std: enables the `compression` module (zlib via flate2) and
# `std::error::Error` for `ZipError`. Without it the crate is `no_std + alloc`
# and the exactly-rounded float operations (`sqrt` / `floor` / `round`) go
# through `libm`. The transcendentals do not depend on this feature: they go
# through `alice-det-math` in both builds.
std = ["dep:flate2", "rand/std", "rand_chacha/std", "alice-det-math/std"]
# rustfft-backed `generators::analyze_signal_fft` (same contract as the naive
# DFT `analyze_signal`, O(n log n)); implies `std`.
fft = ["std", "dep:rustfft"]
# rayon-parallel row generation for the 2D Perlin textures; implies `std`.
parallel = ["std", "dep:rayon"]
# LZMA + the `.alice` residual containers (`compression::{lzma_*, *_residual_*}`);
# implies `std`.
lzma = ["std", "dep:lzma-rs", "dep:crc"]

# needs the `compression` module and the LZMA residual containers
[[example]]
name = "compression_ratio"
required-features = ["lzma"]

[dependencies]
# Deterministic transcendentals. A content identifier for a law is only
# meaningful if evaluating the law returns the same bits everywhere, and the
# platform libm does not promise that: `sin` / `cos` / `atan2` / `log2` are not
# required to be correctly rounded, so two targets may disagree in the last
# place. This crate computes them in Rust, identically on every target, and
# publishes `SEMANTICS_ID` so a stored result can name the arithmetic it used.
alice-det-math = { version = "0.4", default-features = false }
flate2 = { version = "1.0", optional = true }
# `sqrt` / `floor` / `round` for the `no_std` build (the `FloatExt` shim in
# `src/math.rs`). IEEE 754 specifies all three exactly, so these agree with the
# platform versions bit for bit and carry no determinism risk; the operations
# that do are in `alice-det-math` above. Unused under `std`, hence the
# cargo-machete ignore below.
libm = "0.2"
# Seeded permutation table for `generators::PerlinNoise` (no_std capable).
rand = { version = "0.8", default-features = false }
rand_chacha = { version = "0.3", default-features = false }
# SHA-256 for `law::SignalLaw::law_id`. A widely implemented hash is a
# requirement here, not a preference: an independent implementation has to be
# able to reproduce an identifier, so the digest has to be one that every
# language already has. `default-features = false` keeps the no_std build.
sha2 = { version = "0.10", default-features = false }
rustfft = { version = "6.2", optional = true }
lzma-rs = { version = "0.3", optional = true }
# CRC-32 / CRC-64 of the xz container around an `ALICE_ZIP` LZMA fallback
# payload (`container::decompress_legacy_alice_zip` parses that container
# itself so that it can bound the output before decoding). Already in the
# tree through `lzma-rs`.
crc = { version = "3", optional = true }
rayon = { version = "1.10", optional = true }

[dev-dependencies]

[package.metadata.docs.rs]
features = ["std", "fft", "parallel", "lzma"]

[package.metadata.cargo-machete]
ignored = ["libm"]
