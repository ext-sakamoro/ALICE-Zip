[package]
name = "alice-zip-enterprise"
version = "1.0.0"
edition = "2021"
authors = ["Moroya Sakamoto <sakamoro@alicelaw.net>"]
description = "ALICE-Zip Enterprise Edition - Commercial features for ALICE-Zip compression"
license = "Proprietary"
publish = false
keywords = ["compression", "enterprise", "security", "license"]
categories = ["compression", "cryptography"]

[lib]
name = "alice_enterprise"
crate-type = ["rlib"]

[dependencies]
# Core ALICE-Zip library
alice-zip-cli = { path = "../libalice" }

# Cryptography
chacha20poly1305 = "0.10"
sha2 = "0.10"
hkdf = "0.12"

# Random & Security
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = { version = "1.7", features = ["derive"] }

# Error handling
thiserror = "1.0"

# Bitflags for feature flags
bitflags = "2.4"

# Time
chrono = { version = "0.4", features = ["serde"] }

[features]
default = ["security", "license"]
security = []
license = []
access-control = ["security"]
full = ["security", "license", "access-control"]

[dev-dependencies]
tempfile = "3.10"

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# `alice-zip-cli` (libalice) is consumed through its lib name `alice_core`
[package.metadata.cargo-machete]
ignored = ["alice-zip-cli"]
