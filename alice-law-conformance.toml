# ALICE-Law conformance manifest for this crate (alice-zip). One entry per
# gate defined in ALICE-Law's conformance/gates.toml. Schema (status /
# evidence / since / note / reference_repo) is docs/CONFORMANCE.md's
# "Manifest" section in that repository; for a `pass` or `n/a` entry the note
# also names the red mutant (the gate's **Mutant**, as carried out here).
#
# Entries here are written from what this repository's own commits, CI
# workflows and test suites actually show at origin/main, checked directly
# rather than assumed: a gate without concrete evidence is `unverified`, not
# guessed `pass`. The published crate is `alice-zip` (the workspace root);
# evidence that lives in libalice / libalice-enterprise / bindings is in a
# crate that `alice-zip` excludes from its package (Cargo.toml `exclude`), and
# is marked as such where it is cited.

