# Per-feature classification: whether each Cargo feature of alice-zip is inside
# or outside the Law guarantee, per docs/CONFORMANCE.md "Features and the
# guarantee". `inside` requires all three: same arithmetic generation (same
# SEMANTICS_ID, no float path the gates do not cover), same values (same bits,
# or a golden for a feature-added computation), and coverage (an e2e check or a
# named external-reference oracle). Anything else is `outside`, with the note
# saying which condition fails.

[features.std]
guarantee = "inside"
evidence = ["tests/determinism_golden.rs", ".github/workflows/ci.yml Determinism golden (no_std build, same digests as the std build) step", ".github/workflows/ci.yml test job (cargo test and cargo test --lib --no-default-features)"]
note = "std enables the `compression` module (zlib via flate2) and `std::error::Error` for ZipError; it is lossless byte coding with no Law float arithmetic of its own, and the Law transcendentals go through alice-det-math in both the std and no_std builds (Cargo.toml). tests/determinism_golden.rs is written to run under both `cargo test` (std) and `cargo test --no-default-features`, and CI runs it both ways asserting the SAME digests (the 'Determinism golden (no_std build, same digests as the std build)' step), so the feature adds no float path and produces identical bits with and without it — conditions 1-3 met."

[features.lzma]
guarantee = "inside"
evidence = ["tests/residual_container_oracle.rs", "tests/container_oracle.rs", ".github/workflows/ci.yml Feature-gated suites run on this OS step"]
note = "lzma enables LZMA + the `.alice` residual containers (compression::{lzma_*, *_residual_*}); it is lossless byte compression with no Law float arithmetic of its own, so it adds no floating-point path the gates cover and leaves SEMANTICS_ID unchanged. The container oracles (tests/residual_container_oracle.rs, tests/container_oracle.rs) run under this feature and carry/compare the same identifiers as the default build, and the ci.yml 'Feature-gated suites run on this OS' step asserts each reports >= 1 passed test on every OS (so the feature-gated binary is not a silent 0-test pass). Conditions 1-3 met for the lossless codec; it contributes no Law value of its own."

[features.fft]
guarantee = "outside"
note = "fft enables rustfft-backed generators::analyze_signal_fft, a DIFFERENT algorithm (O(n log n)) from the naive DFT analyze_signal, and rustfft computes its own twiddle-factor transcendentals outside alice-det-math — a floating-point path the gates (G1) do not cover, so condition 1 fails. The only test comparing the two paths, tests/analytic_oracle.rs::fft_path_matches_naive_dft_on_random_signals, asserts agreement only within a tolerance (magnitude < 1e-2 + 1e-3*m, phase < 1e-2), not bit-for-bit, and no golden pins analyze_signal_fft's bits, so condition 2 (same values) fails as well. Outside: a non-bit-identical alternate algorithm."

[features.parallel]
guarantee = "outside"
note = "parallel swaps the 2D Perlin row loop (generate_perlin_2d / generate_perlin_advanced, src/generators/perlin.rs:204-207) from a serial flat_map to rayon into_par_iter().flat_map_iter().collect(). Structurally each row is an independent, pure function of (y, seed, scale, ...) and the ordered collect preserves index order with no cross-row float reduction, so the bits are expected to match the serial path. But condition 2 (same bits as without the feature) is not demonstrated: determinism_golden.rs does not cover the Perlin generators, and the perlin oracles (tests/analytic_oracle.rs::perlin_matches_libalice_2_2_reference, ::perlin_textures_are_deterministic_and_seed_sensitive) compare against an external reference within a 1e-6 tolerance or assert same-build reproducibility, neither of which pins parallel-on == parallel-off bit-for-bit; and the G4 architecture matrix that condition 2's golden would have to hold on is itself absent (G4/G5 fail-known). Outside conservatively (row-order / coverage) pending a bit-identical parallel-vs-serial golden."
