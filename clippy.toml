# Determinism gate: a content identifier for a law (`law::SignalLaw::law_id`)
# only means anything if evaluating the law returns the same bits everywhere.
# IEEE 754 does not require the transcendentals to be correctly rounded, so the
# platform libm is free to differ between OS, CPU and compiler, and it does:
# with the transcendentals on the platform libm, building this crate with and
# without the `std` feature on one machine produced different bits for
# `generate_multi_sine` (1 sample of 64) and `analyze_signal` (6 fields of 9).
#
# Everything transcendental therefore goes through `alice-det-math`, whose
# kernels are built from IEEE 754 basic operations only and so compute the same
# bits on every target. CI runs clippy with `--all-targets ... -D warnings`,
# which turns `disallowed_methods` into a red gate for the library, the tests,
# the examples and the benches alike.
#
# Deliberately absent: `sqrt`, `floor`, `round`, `trunc`, `ceil` and `mul_add`.
# IEEE 754 specifies all of them exactly (`mul_add` is a fused multiply-add
# with a single rounding, and a target without an FMA instruction gets the
# correctly rounded software `fma`), so each is bit-identical on every target.
# These are the only operations left in the `no_std` shim `crate::math`.
#
# One place deliberately keeps the platform version: the entropy tests compute
# their expected value with `f64::log2`, because an oracle whose expected value
# comes from the implementation under test proves nothing. The tolerance there
# (1e-9) is seven orders of magnitude looser than any libm disagreement, so the
# reference stays independent without becoming flaky.
#
# Pinned by tests/determinism_golden.rs, which runs on the CI matrix with and
# without default features.
