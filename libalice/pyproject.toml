[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "libalice"
version = "2.3.0"
description = "Native (Rust) accelerator for the alice-zip Python package: generators, LZMA / zlib, quantized residuals (import libalice)"
authors = [
    { name = "Moroya Sakamoto", email = "sakamoro@alicelaw.net" }
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: System :: Archiving :: Compression",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
keywords = ["compression", "procedural-generation", "lossless", "kolmogorov"]

[project.urls]
"Homepage" = "https://github.com/ext-sakamoro/ALICE-Zip"
"Repository" = "https://github.com/ext-sakamoro/ALICE-Zip"

[tool.maturin]
features = ["python"]
module-name = "libalice"
