[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "libalice"
# the version is libalice/Cargo.toml's (one source; maturin reads it)
dynamic = ["version"]
description = "Native (Rust) accelerator for the alice-zip Python package: generators, LZMA / zlib, quantized residuals (import libalice)"
authors = [
    { name = "Moroya Sakamoto" }
]
readme = "README.md"
license = "LicenseRef-Proprietary"
# No `license-files`: maturin finds LICENSE-Proprietary itself (the PEP 639
# default globs), and listing it makes `maturin sdist` add the root copy
# twice. scripts/dist_license_check.py checks the built files.
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: System :: Archiving :: Compression",
    "Operating System :: OS Independent",
]
keywords = ["compression", "procedural-generation", "lossless", "kolmogorov"]

[project.urls]
"Homepage" = "https://github.com/ext-sakamoro/ALICE-Zip"
"Repository" = "https://github.com/ext-sakamoro/ALICE-Zip"

[tool.maturin]
features = ["python"]
module-name = "libalice"
