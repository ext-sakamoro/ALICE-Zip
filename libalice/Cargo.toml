[package]
name = "alice-zip-cli"
version = "2.3.0"
edition = "2021"
# Same MSRV as the core crate; verified by the CI `msrv` job (`cargo +1.87 check`).
# Declared so clippy's MSRV-aware lints do not suggest newer std APIs.
rust-version = "1.87"
resolver = "3"
authors = ["Moroya Sakamoto <sakamoro@alicelaw.net>"]
description = "A next-generation procedural compression engine utilizing Kolmogorov complexity approximation."
readme = "../README.md"
repository = "https://github.com/ext-sakamoro/ALICE-Zip"
license = "MIT"
keywords = ["compression", "lossless", "procedural", "cli"]
categories = ["compression", "command-line-utilities", "science"]
exclude = [
    "tests/commercial_data/*",
    "commercial/*",
    ".github/*"
]

[lib]
name = "alice_core"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "alice"
path = "src/bin/alice.rs"

[dependencies]
# Python bindings (optional for CLI)
pyo3 = { version = "0.29", features = ["extension-module"], optional = true }
numpy = { version = "0.29", optional = true }

# Generator laws (polynomial / Fourier / Perlin) — single home, see
# src/generators/mod.rs. `fft` = rustfft analysis, `parallel` = rayon rows.
alice_zip = { package = "alice-zip", path = "..", version = "0.4", features = ["std", "fft", "parallel"] }

# Seeded white noise for media::audio
rand = "0.8"
rand_chacha = "0.3"

# Compression
lzma-rs = "0.3"
flate2 = "1.1"

# Memory-mapped file I/O
memmap2 = "0.9"

# CLI
clap = { version = "4.5", features = ["derive"] }


# ALICE-Codec wavelet bridge (optional)
# crates.io dependency (0.1.2 = the ALICE-Codec sibling checkout content): a path dep
# would make `cargo check` fail on any machine without ../../ALICE-Codec even with
# the `codec` feature off (cargo reads optional path manifests unconditionally)
alice-codec = { version = "0.1.2", optional = true }

[features]
default = ["cli"]
cli = []
python = ["dep:pyo3", "dep:numpy"]
codec = ["dep:alice-codec"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# `panic = "unwind"` (default) on purpose: every `extern "C"` entry point wraps
# its body in `catch_unwind` (ffi::guarded) so a Rust panic becomes an error
# code instead of aborting the Unity / UE5 / Python host. `panic = "abort"`
# would make that guard a no-op.
strip = true

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
