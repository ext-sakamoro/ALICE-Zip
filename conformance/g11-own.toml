zero = "scripts/test_run_tests.py::RunTests.test_a_named_file_that_ran_zero_fails"
shared = ["scripts/run_tests.sh", "scripts/test_run_tests.py"]

[[row]]
gate = "G7"
checker = ".github/workflows/ci.yml#- name: Container (no_std build, same bytes and identifiers)>scripts/run_tests.sh"
canary = "tests/container_oracle.rs::law_ids_under_other_semantics_are_refused_by_the_checked_reader"
zero = "scripts/test_run_tests.py::RunTests.test_a_named_file_that_ran_zero_fails"
shared = ["scripts/run_tests.sh", "scripts/test_run_tests.py"]

[[row]]
